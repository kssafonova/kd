name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore original collections and capsules
        run: python scripts/restore-original-collections.py

      - name: Sync workbook product specs
        run: python scripts/sync-workbook-product-specs.py

      - name: Restore previous quick-add flow and drawer size
        run: python scripts/restore-quick-add-flow.py

      - name: Add runtime image URL loader
        run: python scripts/add-remote-image-loader.py

      - name: Sync updated product image URLs
        run: python scripts/sync-updated-product-image-urls.py

      - name: Apply reference PDP gallery
        run: python scripts/apply-pdp-reference-gallery.py

      - name: Normalize Luna editorial render
        run: python scripts/normalize-luna-render.py

      - name: Apply Luna editorial capsule
        run: python scripts/apply-luna-editorial.py

      - name: Fix Luna editorial typecheck
        run: python scripts/fix-luna-typecheck.py

      - name: Apply Zara-style Luna bundle flow
        run: python scripts/apply-luna-zara-bundle.py

      - name: Normalize single-color swatches
        run: python scripts/normalize-single-color-swatches.py

      - name: Simplify Luna into grouped stories
        run: python scripts/simplify-luna-groups.py

      - name: Refine Luna story commerce
        run: python scripts/refine-luna-commerce.py

      - name: Make story purchase inline
        run: python scripts/inline-luna-story-purchase.py

      - name: Refine story card controls
        run: python scripts/refine-luna-story-card-controls.py

      - name: Compact PLP quick-add modal
        run: python scripts/compact-plp-quick-add.py

      - name: Persist storefront source updates
        run: |
          if git diff --quiet -- app/page.tsx app/globals.css app/catalog-data.ts; then
            echo "No storefront source changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css app/catalog-data.ts
          git commit -m "Sync storefront editorial and PDP gallery"
          git push origin HEAD:main

      - name: Install dependencies
        run: npm install

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /kd
        run: npx next build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
