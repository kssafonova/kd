name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply PDP recommendation logic
        run: python scripts/patch-pdp-recommendations.py

      - name: Remove bundle purchase and cart upsell flows
        run: python scripts/remove-bundle-upsell.py

      - name: Enable scrollable product media
        run: python scripts/add-scrollable-product-media.py

      - name: Refine product media behavior
        run: python scripts/refine-product-media-behavior.py

      - name: Persist storefront source updates
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo "No storefront source changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Refine product media scroll behavior"
          git push origin HEAD:main

      - name: Install dependencies
        run: npm install

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /kd
        run: npx next build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
