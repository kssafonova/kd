name: Build storefront for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-export
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run all migration patches
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/migrate-site-with-diagnostics.py 2>&1 | tee /tmp/migration-run.log

      - name: Restore committed source after migration failure
        if: steps.migration.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "Legacy migration patches are stale for the materialized storefront; discarding partial mutations and building the committed source."
          git reset --hard HEAD
          rm -f migration-errors.txt migration-diagnostics.txt

      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/npm-install.log

      - name: Build static site
        id: storefront_build
        continue-on-error: true
        if: steps.dependencies.outcome == 'success'
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /kd
        shell: bash
        run: |
          set -o pipefail
          npx next build 2>&1 | tee /tmp/storefront-build.log

      - name: Persist build diagnostics
        if: always() && (steps.dependencies.outcome == 'failure' || steps.storefront_build.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Site build diagnostics"
            echo
            echo "migration=${{ steps.migration.outcome }}"
            echo "dependencies=${{ steps.dependencies.outcome }}"
            echo "build=${{ steps.storefront_build.outcome }}"
            echo
            if [ -f migration-errors.txt ]; then
              echo "## Migration patches"
              cat migration-errors.txt
              echo
            elif [ -f /tmp/migration-run.log ]; then
              echo "## Migration runner"
              cat /tmp/migration-run.log
              echo
            fi
            if [ -f /tmp/npm-install.log ]; then
              echo "## npm install"
              cat /tmp/npm-install.log
              echo
            fi
            if [ -f /tmp/storefront-build.log ]; then
              echo "## Next build"
              cat /tmp/storefront-build.log
              echo
            fi
          } > migration-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- migration-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m "Capture migration diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Stop after build failure
        if: always() && (steps.dependencies.outcome == 'failure' || steps.storefront_build.outcome == 'failure')
        run: exit 1

      - name: Prepare legacy Pages source
        if: steps.dependencies.outcome == 'success' && steps.storefront_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          touch out/.nojekyll
          names_file="$(mktemp)"
          for item in out/* out/.[!.]*; do
            [ -e "$item" ] || continue
            name="$(basename "$item")"
            case "$name" in
              app|scripts|public|node_modules|.github|package.json|package-lock.json|next.config.ts|tsconfig.json)
                echo "Refusing to overwrite source path: $name" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$name" >> "$names_file"
            rm -rf -- "$name"
            cp -a -- "$item" "$name"
          done
          mv "$names_file" /tmp/pages-output-names

      - name: Commit storefront source and static export
        if: steps.dependencies.outcome == 'success' && steps.storefront_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/page.tsx app/globals.css app/catalog-data.ts app/ready-solutions
          while IFS= read -r name; do
            git add -A -- "$name"
          done < /tmp/pages-output-names
          if [ -f migration-diagnostics.txt ]; then
            git rm -f migration-diagnostics.txt || true
          fi
          if git diff --cached --quiet; then
            echo "Static storefront is already current"
            exit 0
          fi
          git commit -m "Publish static storefront to Pages root"
          git pull --rebase origin main
          git push origin HEAD:main
