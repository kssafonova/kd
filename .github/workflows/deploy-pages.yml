name: Build storefront for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-export
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply and validate catalog master
        shell: bash
        run: |
          set -euo pipefail
          python scripts/migrate-site-with-diagnostics.py

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /kd
        shell: bash
        run: npx next build

      - name: Prepare legacy Pages source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/assets/images
          touch out/.nojekyll
          names_file="$(mktemp)"
          for item in out/* out/.[!.]*; do
            [ -e "$item" ] || continue
            name="$(basename "$item")"
            case "$name" in
              app|scripts|public|node_modules|.github|package.json|package-lock.json|next.config.ts|tsconfig.json)
                echo "Refusing to overwrite source path: $name" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$name" >> "$names_file"
            rm -rf -- "$name"
            cp -a -- "$item" "$name"
          done
          mv "$names_file" /tmp/pages-output-names

      - name: Commit storefront source and static export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app public scripts assets
          while IFS= read -r name; do
            git add -A -- "$name"
          done < /tmp/pages-output-names
          if git diff --cached --quiet; then
            echo "Static storefront is already current"
            exit 0
          fi
          git commit -m "Publish static storefront to Pages root"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
