name: Build storefront for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-export
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore original collections and capsules
        run: python scripts/restore-original-collections.py

      - name: Sync workbook product specs
        run: python scripts/sync-workbook-product-specs.py

      - name: Restore previous quick-add flow and drawer size
        run: python scripts/restore-quick-add-flow.py

      - name: Add runtime image URL loader
        run: python scripts/add-remote-image-loader.py

      - name: Sync updated product image URLs
        run: python scripts/sync-updated-product-image-urls.py

      - name: Apply reference PDP gallery
        run: python scripts/apply-pdp-reference-gallery.py

      - name: Normalize single-color swatches
        run: python scripts/normalize-single-color-swatches.py

      - name: Apply adaptive story quick-buy and builder
        shell: bash
        run: |
          if grep -q 'story-v2-layer' app/page.tsx; then
            echo "Adaptive story builder already present"
          else
            python scripts/apply-story-builder-v2.py
          fi

      - name: Refine story quick-buy preset
        run: python scripts/refine-story-builder-v2.py

      - name: Apply homepage reference redesign
        run: python scripts/redesign-home-reference.py

      - name: Add bedroom homepage feature
        run: python scripts/add-home-bedroom-feature.py

      - name: Refine homepage editorial layout
        run: python scripts/refine-homepage-editorial.py

      - name: Remove editorial landing filters
        run: python scripts/remove-editorial-tabs.py

      - name: Install dependencies
        run: npm install

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /kd
        run: npx next build

      - name: Prepare legacy Pages source
        shell: bash
        run: |
          set -euo pipefail
          touch out/.nojekyll
          names_file="$(mktemp)"
          for item in out/* out/.[!.]*; do
            [ -e "$item" ] || continue
            name="$(basename "$item")"
            case "$name" in
              app|scripts|public|node_modules|.github|package.json|package-lock.json|next.config.ts|tsconfig.json)
                echo "Refusing to overwrite source path: $name" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$name" >> "$names_file"
            rm -rf -- "$name"
            cp -a -- "$item" "$name"
          done
          mv "$names_file" /tmp/pages-output-names

      - name: Commit storefront source and static export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/page.tsx app/globals.css app/catalog-data.ts
          while IFS= read -r name; do
            git add -A -- "$name"
          done < /tmp/pages-output-names
          if git diff --cached --quiet; then
            echo "Static storefront is already current"
            exit 0
          fi
          git commit -m "Publish static storefront to Pages root"
          git push origin HEAD:main
