name: Import product images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-product-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import product images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, re, os, hashlib, shutil, subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path('.')
          outdir = root / 'public/images/imported-products'
          outdir.mkdir(parents=True, exist_ok=True)
          urls = set()

          def add_url(value):
              value = (value or '').strip()
              if not value:
                  return
              if value.startswith(('https://', 'http://')):
                  urls.add(value)
              elif value.startswith('/kd/images/'):
                  urls.add('https://kssafonova.github.io' + value)
              elif value.startswith('/images/'):
                  urls.add('https://kssafonova.github.io/kd' + value)

          pattern = r'((?:https?://[^"\']+|/(?:kd/)?images/[^"\']+)\.(?:png|jpe?g|webp))'
          for path in [root / 'app/catalog-data-base.ts', root / 'app/catalog-data.ts']:
              text = path.read_text(encoding='utf-8')
              for match in re.findall(pattern, text, flags=re.I):
                  add_url(match)

          ts = (root / 'app/constructor/table-solutions.ts').read_text(encoding='utf-8')
          literals = set(re.findall(r'"([^"\n]+)"', ts))

          def norm(value):
              text = str(value or '').strip().lower().replace('ё', 'е')
              text = text.replace('«', '').replace('»', '').replace('"', '').replace("'", '')
              return re.sub(r'\s+', ' ', text)

          targets = {norm(value) for value in literals if value.strip()}
          catalog_path = root / 'data/kultura_doma_full_constructor_eligible_catalog.csv'
          with catalog_path.open('r', encoding='utf-8-sig', newline='') as file:
              for row in csv.DictReader(file):
                  name = norm(row.get('product_name', ''))
                  matched = name in targets or any(name.startswith(t + ':') for t in targets if len(t) > 3)
                  if not matched:
                      continue
                  add_url(row.get('primary_image_url', ''))
                  for url in (row.get('all_image_urls', '') or '').split('|'):
                      add_url(url)

          used = {}
          rows = []
          for url in sorted(urls):
              basename = os.path.basename(urlparse(url).path) or 'image'
              target = basename
              if target in used and used[target] != url:
                  stem, ext = os.path.splitext(basename)
                  target = f'{stem}-{hashlib.sha1(url.encode()).hexdigest()[:8]}{ext}'
              used[target] = url
              rows.append((url, target, f'/images/imported-products/{target}'))

          def copy_local_github_pages(url, dest):
              prefix = 'https://kssafonova.github.io/kd/'
              if not url.startswith(prefix):
                  return False
              rel = url[len(prefix):]
              for candidate in (root / rel, root / 'public' / rel):
                  if candidate.is_file():
                      shutil.copyfile(candidate, dest)
                      return True
              return False

          def download(item):
              url, filename, public_path = item
              dest = outdir / filename
              if dest.is_file() and dest.stat().st_size > 0:
                  return item + ('existing',)
              if copy_local_github_pages(url, dest):
                  return item + ('copied-local',)
              tmp = outdir / f'.tmp-{filename}'
              for _ in range(2):
                  result = subprocess.run([
                      'curl', '-fL', '--retry', '1', '--connect-timeout', '10', '--max-time', '30',
                      '-A', 'Mozilla/5.0', url, '-o', str(tmp)
                  ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if result.returncode == 0 and tmp.is_file() and tmp.stat().st_size > 0:
                      tmp.replace(dest)
                      return item + ('downloaded',)
                  tmp.unlink(missing_ok=True)
              return item + ('failed',)

          results = []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(download, item) for item in rows]
              for future in as_completed(futures):
                  results.append(future.result())

          results.sort(key=lambda row: row[0])
          with (outdir / 'manifest.csv').open('w', encoding='utf-8-sig', newline='') as file:
              writer = csv.writer(file)
              writer.writerow(['source_url', 'filename', 'github_pages_path', 'status'])
              writer.writerows(results)

          success = sum(1 for row in results if row[3] != 'failed')
          failed = sum(1 for row in results if row[3] == 'failed')
          print(f'Prepared: {len(rows)}; imported/existing: {success}; failed: {failed}')
          if success == 0:
              raise SystemExit(1)
          PY

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/imported-products
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Import product images from source URLs"
          git pull --rebase origin main
          git push
