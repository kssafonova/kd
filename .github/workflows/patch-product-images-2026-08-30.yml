name: Patch product images 2026-08-30

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-product-images-2026-08-30.yml

permissions:
  contents: write

jobs:
  patch-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update catalog image paths
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("public/data/catalog_master.csv")
          text = path.read_text(encoding="utf-8")
          original = text

          replacements = {
              "/assets/images/KD-PD-1027МОЛОЧНЫЙ.png": "/assets/images/KD-PD-1027МОЛОЧНЫЙ.png",
              "/assets/images/KD-PD-1027СЕРОСИНИЙ.png": "/assets/images/KD-PD-1027СЕРОСИНИЙ.png",
              "/assets/images/KD-PD-10786ГОЛУБОЙ.png": "/assets/images/KD-PD-10786ГОЛУБОЙ.png",
              "/assets/images/KD-PD-10841БЕЖЕВЫЙ.png": "/assets/images/KD-PD-10841БЕЖЕВЫЙ.png",
              "/assets/images/KD-PD-10841ГОЛУБОЙ.png": "/assets/images/KD-PD-10841ГОЛУБОЙ.png",
              "/assets/images/689209814dad6_big.jpg": "/assets/images/KD-PD-8765КОРИЧНЕВЫЙ.png",
              "/assets/images/6a4374e02ae19_big.jpg": "/assets/images/KD-PD-8770БЕЖЕВЫЙ.png",
              "/assets/images/6a4375aa6eaed_big.jpg": "/assets/images/KD-PD-9718БЕЖЕВЫЙ.png",
              "/assets/images/68da59cb6d26a_big.jpg": "/assets/images/KD-PD-10127.png",
              "/assets/images/69b3ce485dc4b_big.jpg": "/assets/images/KD-PD-10375-02.png",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # Two uploaded images for KD-PD-10376 become the primary and secondary gallery photos.
          text = text.replace(
              "/assets/images/69b3ce622cf37_big.jpg;null;null;null",
              "/assets/images/KD-PD-10376-01.png;/assets/images/KD-PD-10376-02.png;null;null",
          )

          # KD-PD-10786 has the uploaded beige variant image but the beige SKU row is absent in the current catalog.
          # Add it by cloning the existing ecru row, preserving all product metadata and replacing only color/image.
          if not re.search(r"^KD-PD-10786;Подушка декоративная Пушица;Бежевый;", text, flags=re.M):
              match = re.search(r"^KD-PD-10786;Подушка декоративная Пушица;экрю;[^\n]*$", text, flags=re.M)
              if match:
                  source = match.group(0)
                  beige = source.replace(";экрю;", ";Бежевый;", 1).replace(
                      "/assets/images/KD-PD-10786ЭКРЮ.png",
                      "/assets/images/KD-PD-10786БЕЖЕВЫЙ.png",
                  )
                  text = text[:match.start()] + beige + "\n" + text[match.start():]

          # Guardrails: every requested uploaded image must now be referenced by the catalog.
          requested = [
              "KD-PD-1027МОЛОЧНЫЙ.png",
              "KD-PD-1027СЕРОСИНИЙ.png",
              "KD-PD-2519.png",
              "KD-PD-10254.png",
              "KD-PD-10256.png",
              "KD-PD-10786БЕЖЕВЫЙ.png",
              "KD-PD-10786ГОЛУБОЙ.png",
              "KD-PD-10786ЭКРЮ.png",
              "KD-PD-10841БЕЖЕВЫЙ.png",
              "KD-PD-10841ГОЛУБОЙ.png",
              "KD-PD-10841ЭКРЮ.png",
              "KD-PD-10911.png",
              "KD-PD-10915.png",
              "KD-PD-10917.png",
              "KD-PD-10918.png",
              "KD-PD-10919.png",
              "KD-PD-10922.png",
              "KD-PD-10924.png",
              "KD-PD-10926.png",
              "KD-PD-10927.png",
              "KD-PD-10928.png",
              "KD-PD-8765КОРИЧНЕВЫЙ.png",
              "KD-PD-8770БЕЖЕВЫЙ.png",
              "KD-PD-9718БЕЖЕВЫЙ.png",
              "KD-PD-10127.png",
              "KD-PD-10375-02.png",
              "KD-PD-10376-01.png",
              "KD-PD-10376-02.png",
          ]
          missing = [name for name in requested if f"/assets/images/{name}" not in text]
          if missing:
              raise SystemExit("Requested images are still missing from catalog references: " + ", ".join(missing))

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Catalog image references updated.")
          else:
              print("Catalog image references already up to date.")

      - name: Commit catalog patch
        shell: bash
        run: |
          if git diff --quiet -- public/data/catalog_master.csv; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog_master.csv
          git commit -m "Update product photos to uploaded assets"
          git push origin HEAD:main
