name: Assemble source
on:
  push:
    branches: [main]
    paths:
      - "source-parts/**"
      - ".github/workflows/assemble-source.yml"
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source files
        run: |
          cat source-parts/app__page.tsx.part-* > app/page.tsx
          cat source-parts/app__globals.css.part-* > app/globals.css
          rm -rf source-parts
      - name: Commit reconstructed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Assemble complete site source"
          git push
