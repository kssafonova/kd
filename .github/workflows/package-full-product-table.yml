name: Package complete product table

on:
  push:
    paths:
      - ".github/workflows/package-full-product-table.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add storefront-only products and validate coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('data/all_products_screen_format.csv')
          with path.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.reader(f)
              data = list(reader)
          headers, rows = data[0], data[1:]

          idx = {h:i for i,h in enumerate(headers)}
          def has(name, aroma):
              return any(r[idx['Название товара']]=='Свеча Феникс' and r[idx['Аромат']]==aroma for r in rows)

          def add_fenix(aroma):
              r = ['null'] * len(headers)
              r[idx['Id']] = '0'
              r[idx['Артикул']] = 'KD-PD-2519'
              r[idx['Название товара']] = 'Свеча Феникс'
              r[idx['Цвет']] = 'Белый / Золотой'
              r[idx['Размер']] = '10 см'
              r[idx['Превью фотография товара']] = 'null'
              r[idx['Вторая фотография товара в скролле']] = 'null'
              r[idx['Третья фотография в скролле']] = 'null'
              r[idx['Высота']] = '10 см'
              r[idx['Ширина']] = 'null'
              r[idx['Объем']] = 'null'
              r[idx['Диаметр']] = 'null'
              r[idx['Комплектация / Информация о размере']] = 'null'
              r[idx['Материал']] = 'null'
              r[idx['Состав']] = 'Воск'
              r[idx['Детали']] = 'null'
              r[idx['Коллекция']] = 'Феникс'
              r[idx['Аромат']] = aroma
              r[idx['Offer ID']] = 'null'
              r[idx['URL товара']] = 'null'
              r[idx['Тип товара']] = 'candle'
              r[idx['Источник']] = 'storefront_manual'
              rows.append(r)

          for aroma in ['Дерево жизни','Сандал и шалфей']:
              if not has('Свеча Феникс', aroma):
                  add_fenix(aroma)

          rows.sort(key=lambda r: (
              '' if r[idx['Коллекция']]=='null' else r[idx['Коллекция']].lower(),
              r[idx['Название товара']].lower(),
              r[idx['Артикул']],
              r[idx['Размер']],
              r[idx['Цвет']]
          ))
          for i,r in enumerate(rows,1):
              r[idx['Id']] = str(i)

          with path.open('w', encoding='utf-8-sig', newline='') as f:
              w=csv.writer(f); w.writerow(headers); w.writerows(rows)

          counts={}
          names=[]
          for r in rows:
              counts[r[idx['Коллекция']]]=counts.get(r[idx['Коллекция']],0)+1
              names.append(r[idx['Название товара']])

          summary = Path('data/all_products_collections_summary.csv')
          with summary.open('w', encoding='utf-8-sig', newline='') as f:
              w=csv.writer(f); w.writerow(['Коллекция','Количество строк/SKU'])
              for c,n in sorted(counts.items(), key=lambda x:(x[0]=='null',x[0].lower())):
                  w.writerow([c,n])

          print('TOTAL_ROWS', len(rows))
          for key in ['Алая нить','Мокоши','Петербург','Весна','Эхо / Камея','Овация / Символы','Ледяные узоры','Лунная сказка','Нити времени','Александр','Дияф','Обереги','Феникс','Тайна острова Буяна','Юрма','Текстура','Росы','Дрёмица','Оренбургские узоры','Бархат']:
              print('COLLECTION', key, counts.get(key,0))
          for term in ['Пушица','Пушница','халат','пижам','зеркал','рамк','деревян','диффузор','свеч']:
              matched=sum(1 for n in names if term.lower() in n.lower())
              print('NAME_TERM', term, matched)
          PY

      - name: Commit final table
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all_products_screen_format.csv data/all_products_collections_summary.csv
          if ! git diff --cached --quiet; then
            git commit -m "Complete full product table coverage"
            git pull --rebase origin main
            git push
          fi

      - name: Upload full product table
        uses: actions/upload-artifact@v4
        with:
          name: full-product-table
          path: |
            data/all_products_screen_format.csv
            data/all_products_collections_summary.csv
          if-no-files-found: error
          retention-days: 7
