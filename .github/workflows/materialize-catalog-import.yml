name: Materialize catalog import

on:
  push:
    paths:
      - data/.catalog_import_ready

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical catalog files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, csv, gzip, io

          payload = Path('data/.catalog_raw_import.b64').read_text(encoding='utf-8').strip()
          raw = gzip.decompress(base64.b64decode(payload))
          raw_text = raw.decode('utf-8-sig')

          # Store the user's source CSV unchanged in canonical repository locations.
          for target in (
              'all_site_products_grouped.csv',
              'data/all_site_products_grouped.csv',
              'public/data/all_site_products_grouped.csv',
          ):
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)

          # Build the comma-separated runtime feed expected by the existing storefront loader.
          reader = csv.DictReader(io.StringIO(raw_text), delimiter=';')
          source_fields = list(reader.fieldnames or [])
          rows = list(reader)
          rename = {
              'Фото 1': 'Превью фотография товара',
              'Фото 2': 'Вторая фотография товара в скролле',
              'Фото 3': 'Третья фотография в стролле',
              'Комплектация / информация о размере': 'Комплектация / Информация о размере',
          }
          runtime_fields = [rename.get(name, name) for name in source_fields if name != 'Капсула.1']
          runtime_io = io.StringIO(newline='')
          writer = csv.DictWriter(runtime_io, fieldnames=runtime_fields, lineterminator='\n')
          writer.writeheader()
          for row in rows:
              out = {}
              for source_name in source_fields:
                  if source_name == 'Капсула.1':
                      continue
                  target_name = rename.get(source_name, source_name)
                  value = row.get(source_name, '')
                  if source_name in ('Товар входит в готовое решение', 'Опционально входит в готовое решение'):
                      value = 'null'
                  out[target_name] = value
              writer.writerow(out)
          runtime = runtime_io.getvalue().encode('utf-8')
          for target in ('data/catalog_xlsx_full.csv', 'public/data/catalog_xlsx_full.csv'):
              Path(target).write_bytes(runtime)

          page_path = Path('app/page.tsx')
          page = page_path.read_text(encoding='utf-8')

          start = page.index('const baseProducts: Product[] = [')
          end = page.index('\n\nconst REMOVED_PRODUCT_IDS', start)
          page = page[:start] + 'const baseProducts: Product[] = [];' + page[end:]

          start = page.index('const collectionEditorialProducts:Product[] = [')
          end = page.index('\n\n// COLLECTIONS_REDESIGN_V65', start)
          page = page[:start] + 'const collectionEditorialProducts:Product[] = [];' + page[end:]

          page = page.replace(
              'const cleanNulls=(value:unknown)=>{const text=String(value??"").trim();return !text||text==="null"?undefined:text};',
              'const cleanNulls=(value:unknown)=>{const text=String(value??"").trim();return !text||text.toLowerCase()==="null"?undefined:text};',
          )
          page = page.replace(
              'const solutionTags=Array.from(new Set([...splitMultiline(product.readySolution),...splitMultiline(product.optionalReadySolution)]));',
              'const solutionTags:string[]=[];',
          )
          page_path.write_text(page, encoding='utf-8')
          PY
      - name: Commit refreshed catalog
        shell: bash
        run: |
          git config user.name "catalog-import-bot"
          git config user.email "catalog-import-bot@users.noreply.github.com"
          git add all_site_products_grouped.csv data/all_site_products_grouped.csv public/data/all_site_products_grouped.csv data/catalog_xlsx_full.csv public/data/catalog_xlsx_full.csv app/page.tsx
          if git diff --cached --quiet; then
            echo "No catalog changes to commit"
          else
            git commit -m "Refresh catalog from all_site_products_grouped.csv"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
