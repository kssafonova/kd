name: Finalize catalog refresh

on:
  push:
    paths:
      - data/catalog-refresh-trigger.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final storefront catalog cleanup
        run: python scripts/finalize_catalog_refresh.py
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "catalog-import-bot"
          git config user.email "catalog-import-bot@users.noreply.github.com"
          git add app/page.tsx
          git rm -f scripts/finalize_catalog_refresh.py .github/workflows/materialize-catalog-import.yml data/catalog-refresh-trigger.txt data/.catalog_raw_import.b64 data/.catalog_runtime_import.b64 || true
          git commit -m "Finalize CSV-only catalog storefront"
          git pull --rebase origin main
          git push origin HEAD:main
