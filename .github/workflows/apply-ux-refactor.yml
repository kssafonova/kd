name: Apply storefront UX refactor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ux-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize recommendation logic in source
        run: python scripts/patch-pdp-recommendations.py

      - name: Apply UX and logic refactor
        run: python scripts/apply-ux-refactor.py

      - name: Install dependencies
        run: npm install

      - name: Validate production build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /kd
        run: npx next build

      - name: Remove build-time patches
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-pages.yml')
          text = path.read_text()
          block = '''      - name: Apply PDP recommendation logic
        run: python scripts/patch-pdp-recommendations.py

'''
          if block not in text:
              raise SystemExit('Deploy patch block not found')
          path.write_text(text.replace(block, '', 1))
          PY
          rm scripts/patch-pdp-recommendations.py
          rm scripts/apply-ux-refactor.py
          rm .github/workflows/apply-ux-refactor.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/ux-system.css app/layout.tsx .github/workflows/deploy-pages.yml scripts .github/workflows
          git commit -m "Harden storefront UX, responsive layout and shopping flows"
          git push
