name: Sync catalog payload

on:
  push:
    paths:
      - 'data/catalog_xlsx_full.csv.gz.b64'
      - 'data/all_site_products_grouped.csv.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode catalog files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d data/catalog_xlsx_full.csv.gz.b64 | gzip -dc > data/catalog_xlsx_full.csv
          base64 -d data/all_site_products_grouped.csv.gz.b64 | gzip -dc > data/all_site_products_grouped.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          compat = Path('data/catalog_xlsx_full.csv')
          original = Path('data/all_site_products_grouped.csv')
          assert compat.stat().st_size > 80000, compat.stat().st_size
          assert original.stat().st_size > 90000, original.stat().st_size
          with compat.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 218, len(rows)
          assert len({r['Артикул'] for r in rows}) == 155
          with original.open(encoding='utf-8-sig', newline='') as f:
              rows_original = list(csv.DictReader(f, delimiter=';'))
          assert len(rows_original) == 218, len(rows_original)
          PY
      - name: Commit decoded catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog_xlsx_full.csv data/all_site_products_grouped.csv
          if ! git diff --cached --quiet; then
            git commit -m "Sync full grouped product catalog"
            git push
          fi
