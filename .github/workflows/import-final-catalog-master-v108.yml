name: Import final catalog master v108

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-final-catalog-master-v108.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace catalog with final master
        env:
          CATALOG_BUNDLE_GZ_B64: ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import json
          import os

          root = Path.cwd()
          bundle = json.loads(gzip.decompress(base64.b64decode(os.environ["CATALOG_BUNDLE_GZ_B64"])).decode("utf-8"))

          for relative, content in bundle["files"].items():
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          for relative in bundle["delete"]:
              path = root / relative
              if path.exists():
                  path.unlink()

          temporary = root / ".github" / "workflows" / "import-final-catalog-master-v108.yml"
          if temporary.exists():
              temporary.unlink()
          PY

          python scripts/apply-catalog-master-v107.py
          python scripts/verify-catalog-master-v107.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace catalog with final catalog_master"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
