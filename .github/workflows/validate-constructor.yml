name: Validate constructor integration

on:
  push:
    branches: [constructor-integration, editorial-scenarios]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply homepage constructor CTA
        run: python scripts/add-constructor-home-cta.py

      - name: Apply Editorial scenario navigation
        if: github.ref_name == 'editorial-scenarios'
        shell: bash
        run: |
          python scripts/remove-editorial-tabs.py
          python scripts/add-editorial-scenario-navigation.py

      - name: Install dependencies
        run: npm install

      - name: Run project build
        id: project_build
        continue-on-error: true
        shell: bash
        env:
          NEXT_PUBLIC_BASE_PATH: /kd
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -o pipefail
          npm run build 2>&1 | tee npm-build.log

      - name: Run clean Next.js static export build
        id: next_build
        continue-on-error: true
        shell: bash
        env:
          NEXT_PUBLIC_BASE_PATH: /kd
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -o pipefail
          rm -rf .next out
          npx next build 2>&1 | tee next-build.log

      - name: Verify static routes
        id: route_check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f out/constructor/index.html
          for scenario in red-thread-tea quiet-obereg sky-celebration green-salon blue-hour-bedroom; do
            test -f "out/constructor/${scenario}/index.html"
          done
          if [[ "${GITHUB_REF_NAME}" == "editorial-scenarios" ]]; then
            for scenario in red-thread-tea quiet-obereg sky-celebration green-salon multicolor-garden white-classic crystal-evening quiet-morning-bedroom blue-hour-bedroom; do
              test -f "out/editorial/scenario/${scenario}/index.html"
            done
          fi
          echo "All static routes exist"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constructor-build-diagnostics
          path: |
            npm-build.log
            next-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if validation failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.project_build.outcome }}" != "success" ]]; then
            echo "npm run build failed"
            exit 1
          fi
          if [[ "${{ steps.next_build.outcome }}" != "success" ]]; then
            echo "npx next build failed"
            exit 1
          fi
          if [[ "${{ steps.route_check.outcome }}" != "success" ]]; then
            echo "static route check failed"
            exit 1
          fi
