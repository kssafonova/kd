name: Update PDP details and boutique map

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-pdp-details.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pdp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch product page UX
        run: python scripts/update-pdp-ux.py

      - name: Commit UX changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "Redesign PDP accordions and boutique availability map"
          git push
