name: Import site media

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current site media into public/images
        shell: bash
        run: |
          set -euo pipefail
          origin="https://kultura-doma-premium.micromaaash.chatgpt.site"
          mkdir -p public/images
          files=(
            beige-bedroom.png
            beige-quilt.jpg
            blue-bedding-vertical.png
            blue-bedroom.png
            buyan-editorial.png
            classic-bedroom.png
            editorial-table.webp
            editorial-vases.webp
            kultura-home-mobile.mp4
            moon-plate.png
            night-editorial.png
            peach-sheet.jpg
            poetry-editorial.png
            russian-bedroom.png
            russian-service-blue.png
            sky-bolster.png
            time-collection.png
            time-hero.png
            time-mug.png
            time-table.png
            time-tea-pair.png
            zip-collection-night.png
            zip-hero-summer.png
            zip-product-bed.png
          )
          for file in "${files[@]}"; do
            echo "Downloading $file"
            curl --fail --location --retry 3 --retry-delay 2 \
              "$origin/images/$file" \
              --output "public/images/$file"
            test -s "public/images/$file"
          done

      - name: Commit media to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "Media already present"
            exit 0
          fi
          git commit -m "Store site media in repository"
          git push
