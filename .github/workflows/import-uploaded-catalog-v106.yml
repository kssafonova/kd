name: Import uploaded catalog v106

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-uploaded-catalog-v106.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace canonical and runtime catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, csv, io

          ROOT = Path.cwd()
          payload = """"""
          raw = gzip.decompress(base64.b64decode(payload))
          text = raw.decode("utf-8-sig")
          rows = list(csv.DictReader(io.StringIO(text), delimiter=";"))

          source_headers = [
              "ID","Артикул","Название товара","Цвет","Аромат","Размер","Цена","Старая цена","Высота","Ширина","Объем","Диаметр",
              "Комплектация / информация о размере","Материал","Состав","Детали","Коллекция","Капсула","Категория","Подкатегория",
              "Товар входит в готовое решение","Опционально входит в готовое решение","Капсула.1","Фото 1","Фото 2","Фото 3"
          ]
          runtime_headers = [
              "Id","Артикул","Название товара","Цвет","Аромат","Размер","Цена","Старая цена","Высота","Ширина","Объем","Диаметр",
              "Комплектация / Информация о размере","Материал","Состав","Детали","Коллекция","Капсула","Категория","Подкатегория",
              "Товар входит в готовое решение","Опционально входит в готовое решение","Описание готового решения",
              "Превью фотография товара","Вторая фотография товара в скролле","Третья фотография в стролле"
          ]
          def clean(v):
              s = str(v or "").strip()
              return "" if not s or s.lower() == "null" else s
          def photo_name(v):
              s = clean(v).replace("\\", "/")
              return s.split("/")[-1].split("?")[0].split("#")[0] if s else ""

          source_rows = []
          runtime_rows = []
          for r in rows:
              p1 = photo_name(r.get("Превью фотография товара"))
              p2 = photo_name(r.get("Вторая фотография товара в скролле"))
              src = {
                  "ID": clean(r.get("Id")),
                  "Артикул": clean(r.get("Артикул")),
                  "Название товара": clean(r.get("Название товара")),
                  "Цвет": clean(r.get("Цвет")),
                  "Аромат": clean(r.get("Аромат")),
                  "Размер": clean(r.get("Размер")),
                  "Цена": clean(r.get("Цена")),
                  "Старая цена": clean(r.get("Старая цена")),
                  "Высота": clean(r.get("Высота")),
                  "Ширина": clean(r.get("Ширина")),
                  "Объем": clean(r.get("Объем")),
                  "Диаметр": clean(r.get("Диаметр")),
                  "Комплектация / информация о размере": clean(r.get("Комплектация / Информация о размере")),
                  "Материал": clean(r.get("Материал")),
                  "Состав": clean(r.get("Состав")),
                  "Детали": clean(r.get("Детали")),
                  "Коллекция": clean(r.get("Коллекция")),
                  "Капсула": clean(r.get("Капсула")),
                  "Категория": clean(r.get("Категория")),
                  "Подкатегория": clean(r.get("Подкатегория")),
                  "Товар входит в готовое решение": clean(r.get("Товар входит в готовое решение")),
                  "Опционально входит в готовое решение": clean(r.get("Опционально входит в готовое решение")),
                  "Капсула.1": clean(r.get("Описание готового решения")),
                  "Фото 1": f"https://kssafonova.github.io/images/imported-products/{p1}" if p1 else "",
                  "Фото 2": f"https://kssafonova.github.io/images/imported-products/{p2}" if p2 else "",
                  "Фото 3": "",
              }
              source_rows.append(src)
              runtime_rows.append({
                  "Id": src["ID"],
                  "Артикул": src["Артикул"],
                  "Название товара": src["Название товара"],
                  "Цвет": src["Цвет"],
                  "Аромат": src["Аромат"],
                  "Размер": src["Размер"],
                  "Цена": src["Цена"],
                  "Старая цена": src["Старая цена"],
                  "Высота": src["Высота"],
                  "Ширина": src["Ширина"],
                  "Объем": src["Объем"],
                  "Диаметр": src["Диаметр"],
                  "Комплектация / Информация о размере": src["Комплектация / информация о размере"],
                  "Материал": src["Материал"],
                  "Состав": src["Состав"],
                  "Детали": src["Детали"],
                  "Коллекция": src["Коллекция"],
                  "Капсула": src["Капсула"],
                  "Категория": src["Категория"],
                  "Подкатегория": src["Подкатегория"],
                  "Товар входит в готовое решение": "",
                  "Опционально входит в готовое решение": "",
                  "Описание готового решения": "",
                  "Превью фотография товара": f"/images/imported-products/{p1}" if p1 else "",
                  "Вторая фотография товара в скролле": f"/images/imported-products/{p2}" if p2 else "",
                  "Третья фотография в стролле": "",
              })

          source = ROOT / "scripts/product-source/all_site_products_grouped.csv"
          runtime = ROOT / "public/data/catalog_xlsx_full.csv"
          with source.open("w", encoding="utf-8-sig", newline="") as fh:
              w = csv.DictWriter(fh, fieldnames=source_headers, delimiter=";", lineterminator="\n")
              w.writeheader(); w.writerows(source_rows)
          with runtime.open("w", encoding="utf-8-sig", newline="") as fh:
              w = csv.DictWriter(fh, fieldnames=runtime_headers, lineterminator="\n")
              w.writeheader(); w.writerows(runtime_rows)

          materializer = ROOT / "scripts/materialize-grouped-source-v97.py"
          materializer.write_text("""from pathlib import Path
import csv

ROOT = Path(__file__).resolve().parents[1]
TARGET = ROOT / "scripts" / "product-source" / "all_site_products_grouped.csv"
EXPECTED_HEADERS = [
    "ID","Артикул","Название товара","Цвет","Аромат","Размер","Цена","Старая цена","Высота","Ширина","Объем","Диаметр",
    "Комплектация / информация о размере","Материал","Состав","Детали","Коллекция","Капсула","Категория","Подкатегория",
    "Товар входит в готовое решение","Опционально входит в готовое решение","Капсула.1","Фото 1","Фото 2","Фото 3"
]

with TARGET.open("r", encoding="utf-8-sig", newline="") as fh:
    reader = csv.DictReader(fh, delimiter=";")
    if reader.fieldnames != EXPECTED_HEADERS:
        raise SystemExit(f"Unexpected canonical source headers: {reader.fieldnames}")
    rows = list(reader)

articles = {
    str(row.get("Артикул") or "").strip()
    for row in rows
    if str(row.get("Артикул") or "").strip()
}
print(
    f"// GROUPED_SOURCE_V106: using committed canonical catalog source; "
    f"{len(rows)} rows / {len(articles)} articles -> {TARGET.relative_to(ROOT)}"
)
""", encoding="utf-8")

          print(f"Imported {len(rows)} SKU rows / {len({r['Артикул'] for r in rows})} article cards")
          PY
      - name: Commit catalog import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/product-source/all_site_products_grouped.csv public/data/catalog_xlsx_full.csv scripts/materialize-grouped-source-v97.py
          git rm -f .github/workflows/import-uploaded-catalog-v106.yml
          git commit -m "Import updated 199-row product catalog"
          git pull --rebase origin main
          git push origin HEAD:main
