name: Export catalog CSV

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-catalog-csv.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: catalog_xlsx_full-csv
          path: public/data/catalog_xlsx_full.csv
          if-no-files-found: error
          retention-days: 1
