name: Export site screenshots to PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-site-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
          python -m pip install --upgrade pip
          pip install pillow reportlab

      - name: Discover routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ignored_parts = {'.git', '.github', '_next', 'node_modules', 'exports'}
          routes=[]
          for p in Path('.').rglob('index.html'):
              if set(p.parts) & ignored_parts:
                  continue
              if p.parts and p.parts[0] == '404':
                  continue
              parent=p.parent.as_posix()
              route='/' if parent == '.' else '/' + parent.strip('/') + '/'
              routes.append(route)
          routes=sorted(set(routes), key=lambda x:(x.count('/'), x))
          Path('routes.txt').write_text('\n'.join(routes)+'\n', encoding='utf-8')
          print(f'Discovered {len(routes)} routes')
          print('\n'.join(routes))
          PY

      - name: Start static server under Pages base path
        run: |
          ln -s . kd
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/kd-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8000/kd/ >/dev/null

      - name: Capture desktop and mobile screenshots
        run: |
          cat > /tmp/capture.mjs <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');
          const routes = fs.readFileSync('routes.txt','utf8').split(/\r?\n/).filter(Boolean);
          const base = 'http://127.0.0.1:8000/kd';
          const safe = r => r === '/' ? 'home' : r.replace(/^\/+|\/+$/g,'').replace(/[^a-zA-Z0-9._-]+/g,'__');
          fs.mkdirSync('export/desktop', {recursive:true});
          fs.mkdirSync('export/mobile', {recursive:true});
          const browser = await chromium.launch({headless:true});
          async function capture(mode, viewport) {
            const context = await browser.newContext({viewport, deviceScaleFactor:1, locale:'ru-RU'});
            const page = await context.newPage();
            for (let i=0;i<routes.length;i++) {
              const route=routes[i], url=base+route;
              console.log(`[${mode}] ${i+1}/${routes.length} ${route}`);
              try { await page.goto(url, {waitUntil:'networkidle', timeout:45000}); }
              catch { await page.goto(url, {waitUntil:'load', timeout:45000}); await page.waitForTimeout(2000); }
              await page.evaluate(async () => {
                await Promise.all([...document.images].map(img => img.complete ? null : new Promise(res => { img.addEventListener('load',res,{once:true}); img.addEventListener('error',res,{once:true}); setTimeout(res,5000); })));
                if (document.fonts?.ready) await document.fonts.ready;
              });
              await page.waitForTimeout(500);
              await page.screenshot({path:path.join('export',mode,`${String(i+1).padStart(3,'0')}__${safe(route)}.png`), fullPage:true});
            }
            await context.close();
          }
          await capture('desktop', {width:1440,height:1000});
          await capture('mobile', {width:390,height:844});
          await browser.close();
          JS
          node /tmp/capture.mjs

      - name: Build PDFs
        run: |
          cat > /tmp/build_pdf.py <<'PY'
          from pathlib import Path
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.utils import ImageReader
          ROOT=Path('export')
          def write(imgs,out):
              c=None
              for p in imgs:
                  with Image.open(p) as im: w,h=im.size
                  pw,ph=w*0.75,h*0.75
                  if c is None: c=canvas.Canvas(str(out), pagesize=(pw,ph), pageCompression=1)
                  else: c.setPageSize((pw,ph))
                  c.drawImage(ImageReader(str(p)),0,0,width=pw,height=ph,mask='auto')
                  c.showPage()
              if c: c.save()
          desktop=sorted((ROOT/'desktop').glob('*.png'))
          mobile=sorted((ROOT/'mobile').glob('*.png'))
          write(desktop, ROOT/'kd_all_pages_desktop.pdf')
          write(mobile, ROOT/'kd_all_pages_mobile.pdf')
          write(desktop+mobile, ROOT/'kd_all_pages_desktop_mobile.pdf')
          PY
          python /tmp/build_pdf.py
          cp routes.txt export/routes.txt
          mkdir -p exports
          cp export/*.pdf export/routes.txt exports/
          ls -lh exports/

      - name: Upload PDFs artifact
        uses: actions/upload-artifact@v4
        with:
          name: kd-site-screenshots-pdf
          path: exports/
          if-no-files-found: error
          retention-days: 7

      - name: Commit PDFs to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/
          git commit -m 'Update site screenshot PDFs' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
