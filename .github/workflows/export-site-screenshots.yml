name: Export site screenshots to PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-site-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
          python -m pip install --upgrade pip
          pip install pillow reportlab

      - name: Discover routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          ignored_parts = {'.git', '.github', '_next', 'node_modules'}
          routes=[]
          for p in Path('.').rglob('index.html'):
              parts=set(p.parts)
              if parts & ignored_parts:
                  continue
              if p.parts and p.parts[0] == '404':
                  continue
              parent=p.parent.as_posix()
              if parent == '.':
                  route='/'
              else:
                  route='/' + parent.strip('/') + '/'
              routes.append(route)
          routes=sorted(set(routes), key=lambda x:(x.count('/'), x))
          Path('routes.txt').write_text('\n'.join(routes)+'\n', encoding='utf-8')
          print(f'Discovered {len(routes)} routes')
          print('\n'.join(routes))
          PY

      - name: Start static server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/kd-server.log 2>&1 &
          echo $! > /tmp/kd-server.pid
          sleep 2
          curl --fail http://127.0.0.1:8000/ >/dev/null

      - name: Capture desktop and mobile screenshots
        run: |
          cat > /tmp/capture.mjs <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          const routes = fs.readFileSync('routes.txt','utf8').split(/\r?\n/).filter(Boolean);
          const base = 'http://127.0.0.1:8000';
          const safe = r => r === '/' ? 'home' : r.replace(/^\/+|\/+$/g,'').replace(/[^a-zA-Z0-9._-]+/g,'__');
          fs.mkdirSync('export/desktop', {recursive:true});
          fs.mkdirSync('export/mobile', {recursive:true});
          const browser = await chromium.launch({headless:true});

          async function capture(mode, viewport, deviceScaleFactor=1) {
            const context = await browser.newContext({viewport, deviceScaleFactor, locale:'ru-RU'});
            const page = await context.newPage();
            for (let i=0;i<routes.length;i++) {
              const route=routes[i];
              const url=base+route;
              console.log(`[${mode}] ${i+1}/${routes.length} ${route}`);
              try {
                await page.goto(url, {waitUntil:'networkidle', timeout:45000});
              } catch (e) {
                console.log(`networkidle timeout; retrying load for ${route}`);
                await page.goto(url, {waitUntil:'load', timeout:45000});
                await page.waitForTimeout(2500);
              }
              await page.evaluate(async () => {
                const imgs=[...document.images];
                await Promise.all(imgs.map(img => img.complete ? null : new Promise(res => { img.addEventListener('load',res,{once:true}); img.addEventListener('error',res,{once:true}); setTimeout(res,5000); })));
                if (document.fonts?.ready) await document.fonts.ready;
              });
              await page.waitForTimeout(500);
              const outfile=path.join('export',mode,`${String(i+1).padStart(3,'0')}__${safe(route)}.png`);
              await page.screenshot({path:outfile, fullPage:true});
            }
            await context.close();
          }

          await capture('desktop', {width:1440,height:1000}, 1);
          await capture('mobile', {width:390,height:844}, 1);
          await browser.close();
          JS
          node /tmp/capture.mjs

      - name: Build PDFs
        run: |
          cat > /tmp/build_pdf.py <<'PY'
          from pathlib import Path
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.utils import ImageReader

          ROOT=Path('export')

          def make_pdf(mode, out):
              imgs=sorted((ROOT/mode).glob('*.png'))
              c=None
              for idx,p in enumerate(imgs):
                  with Image.open(p) as im:
                      w,h=im.size
                  # 1 px ~= 0.75 pt, giving a full-page screenshot as one PDF page.
                  pw,ph=w*0.75,h*0.75
                  if c is None:
                      c=canvas.Canvas(str(out), pagesize=(pw,ph), pageCompression=1)
                  else:
                      c.setPageSize((pw,ph))
                  c.drawImage(ImageReader(str(p)),0,0,width=pw,height=ph,preserveAspectRatio=True,mask='auto')
                  c.showPage()
              if c is None:
                  c=canvas.Canvas(str(out)); c.drawString(72,720,'No pages found'); c.showPage()
              c.save()

          ROOT.mkdir(exist_ok=True)
          make_pdf('desktop', ROOT/'kd_all_pages_desktop.pdf')
          make_pdf('mobile', ROOT/'kd_all_pages_mobile.pdf')

          # Combined: all desktop pages followed by all mobile pages.
          all_imgs=sorted((ROOT/'desktop').glob('*.png')) + sorted((ROOT/'mobile').glob('*.png'))
          c=None
          for p in all_imgs:
              with Image.open(p) as im:
                  w,h=im.size
              pw,ph=w*0.75,h*0.75
              if c is None:
                  c=canvas.Canvas(str(ROOT/'kd_all_pages_desktop_mobile.pdf'), pagesize=(pw,ph), pageCompression=1)
              else:
                  c.setPageSize((pw,ph))
              c.drawImage(ImageReader(str(p)),0,0,width=pw,height=ph,preserveAspectRatio=True,mask='auto')
              c.showPage()
          if c is not None: c.save()
          PY
          python /tmp/build_pdf.py
          cp routes.txt export/routes.txt
          ls -lh export/*.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: kd-site-screenshots-pdf
          path: |
            export/kd_all_pages_desktop.pdf
            export/kd_all_pages_mobile.pdf
            export/kd_all_pages_desktop_mobile.pdf
            export/routes.txt
          if-no-files-found: error
          retention-days: 7
